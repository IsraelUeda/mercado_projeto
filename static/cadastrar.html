<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Produto</title>
</head>
<body>

    
    <h1>Cadastrar Produto</h1>

    <label>Nome:</label>
    <input type="text" id="nome">
    <br><br>

    <label>Preço:</label>
    <input type="number" id="preco" step="0.01">
    <br><br>

    
    <label>Quantidade de produtos:</label>
    <input type="number" id="quantidade_estoque" step="0.01">
    <br><br>

    <button onclick="cadastrar()">Cadastrar</button>
    <br><br>

    <p id="mensagem"></p>

    <hr> <h1>Excluir Produto</h1>

    <label>ID do Produto:</label>
    <input type="number" id="id_excluir" placeholder="Ex: 1">
    <br><br>

    <button onclick="excluir(document.getElementById('id_excluir').value)">Excluir</button>

    
    <ul id="lista"></ul>


    <script>
         async function carregarProdutos() {
            const resposta = await fetch("/produtos");
            const produtos = await resposta.json();

            const lista = document.getElementById("lista");

            produtos.forEach(produto => {
                const item = document.createElement("li");
                item.textContent = produto.nome + " - R$ " + produto.preco + " (ID: " + produto.codigo + ") + Estoque: " + produto.quantidade_estoque;
                lista.appendChild(item);
            });
        }

        carregarProdutos();

        async function cadastrar() {
            const nome = document.getElementById("nome").value;
            const preco = parseFloat(document.getElementById("preco").value);
            const quantidade_estoque = parseInt(document.getElementById("quantidade_estoque").value, 10);

            if (!nome || isNaN(preco)) {
                document.getElementById("mensagem").textContent = "Preencha todos os campos corretamente.";
                return;
            }

            const resposta = await fetch("/produtos", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ nome, preco, quantidade_estoque: quantidade_estoque })
            });

            if (resposta.ok) {
                document.getElementById("mensagem").textContent = "Produto cadastrado com sucesso!";
                document.getElementById("nome").value = "";
                document.getElementById("preco").value = "";

            } else {
                document.getElementById("mensagem").textContent = "Erro ao cadastrar produto.";
            }
        }

      async function excluir(idProduto) {
    // 1. Verifica se o campo não está vazio
    if (!idProduto) {
        document.getElementById("mensagem").textContent = "Por favor, digite um código para excluir.";
        return; 
    }

    if (!confirm("Tem certeza que deseja excluir o produto " + idProduto + "?")) {
        return; 
    }

    try {
        const url = "/produtos/" + idProduto;

        const resposta = await fetch(url, {
            method: "DELETE"
        });

        if (resposta.ok) {
            document.getElementById("mensagem").textContent = "Produto excluído com sucesso!";
            document.getElementById("id_excluir").value = ""; // Limpa o campo
        } else {
            // Se o servidor retornar 404 (Não Encontrado)
            document.getElementById("mensagem").textContent = "Erro: Produto não encontrado.";
        }
    } catch (erro) {
        console.error(erro);
        document.getElementById("mensagem").textContent = "Erro de conexão ao excluir.";
    }
}
    
    </script>

</body>
</html>
