<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Produto</title>
</head>
<body>

    <h1>Cadastrar Produto</h1>

    <label>Nome:</label>
    <input type="text" id="nome">
    <br><br>

    <label>Preço:</label>
    <input type="number" id="preco" step="0.01">
    <br><br>

    <button onclick="cadastrar()">Cadastrar</button>

    <p id="mensagem"></p>

    
    <ul id="lista"></ul>
    <script>
        async function cadastrar() {
            const nome = document.getElementById("nome").value;
            const preco = parseFloat(document.getElementById("preco").value);

            if (!nome || isNaN(preco)) {
                document.getElementById("mensagem").textContent = "Preencha todos os campos corretamente.";
                return;
            }

            const resposta = await fetch("/produtos", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ nome, preco })
            });

            if (resposta.ok) {
                document.getElementById("mensagem").textContent = "Produto cadastrado com sucesso!";
                document.getElementById("nome").value = "";
                document.getElementById("preco").value = "";

            } else {
                document.getElementById("mensagem").textContent = "Erro ao cadastrar produto.";
            }
        }
    
    </script>

</body>
</html>
