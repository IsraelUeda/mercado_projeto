<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mercado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">
        <h2 class="mb-4 text-center">🛒 Sistema de Mercado</h2>

        <div class="row g-3 mb-4">
            <div class="col-md-5">
                <input type="text" id="nome" class="form-control" placeholder="Nome do produto">
            </div>
            <div class="col-md-5">
                <input type="number" id="preco" class="form-control" placeholder="Preço">
            </div>
            <div class="col-md-2 d-grid">
                <button onclick="criarProduto()" class="btn btn-primary">Salvar</button>
            </div>
        </div>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>Preço</th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </div>

</div>

<script>
    async function carregarProdutos() {
        const resposta = await fetch("/produtos");
        const produtos = await resposta.json();

        const lista = document.getElementById("lista");
        lista.innerHTML = "";

        produtos.forEach(p => {
            lista.innerHTML += `
                <tr>
                    <td>${p.nome}</td>
                    <td>R$ ${p.preco.toFixed(2)}</td>
                </tr>
            `;
        });
    }

    async function criarProduto() {
        const nome = document.getElementById("nome").value;
        const preco = parseFloat(document.getElementById("preco").value);

        if (!nome || !preco) {
            alert("Preencha todos os campos");
            return;
        }

        await fetch("/produtos", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nome, preco })
        });

        document.getElementById("nome").value = "";
        document.getElementById("preco").value = "";

        carregarProdutos();
    }

    carregarProdutos();
</script>

</body>
</html>
